<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14263f">
  <meta name="description" content="Публичная карточка товара Склад МДС">
  <title>Карточка товара — Склад МДС</title>
  <style>
    :root{color-scheme:light;--ink:#17253a;--muted:#64748b;--blue:#087fe8;--line:#e5eaf3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:22px;background:radial-gradient(circle at top,#e6edff 0,#f5f7fb 48%,#eef2f8 100%);font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}
    .card{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 20px 60px rgba(20,38,63,.12);padding:34px 28px;text-align:center}
    .logo{display:flex;justify-content:center;align-items:center;margin:0 auto 16px}.logo img{display:block;width:min(210px,72%);height:auto;object-fit:contain}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.8px;color:#5672a6}
    h1{font-size:clamp(24px,6vw,34px);line-height:1.18;margin:17px 0 8px;overflow-wrap:anywhere}
    .brand{color:var(--muted);font-size:16px;overflow-wrap:anywhere}
    .price{margin-top:27px;font-size:clamp(36px,9vw,50px);font-weight:850;letter-spacing:-1px;color:var(--blue);overflow-wrap:anywhere}
    .unit{color:var(--muted);margin-top:5px;font-size:14px}
    .note{border-top:1px solid #edf0f5;margin-top:28px;padding-top:18px;color:#7a8799;font-size:13px;line-height:1.5}
    .state{color:var(--muted);font-size:15px;line-height:1.55;margin-top:18px}
    .spinner{width:26px;height:26px;border:3px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none}
    .retry{margin-top:18px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}
    .footer{margin-top:18px;color:#9aa5b4;font-size:11px}
  </style>
</head>

    <div class="eyebrow">СКЛАД МДС · КАРТОЧКА ТОВАРА</div>
    <div id="loading" class="state">Загружаем информацию о товаре…</div>
    <div id="spinner" class="spinner"></div>
    <section id="product" class="hidden">
      <h1 id="name"></h1>
      <div id="brand" class="brand"></div>
      <div id="price" class="price"></div>
      <div id="unit" class="unit"></div>
      <div class="note">Актуальная розничная цена. Для уточнения наличия свяжитесь с продавцом.</div>
    </section>
    <section id="error" class="hidden">
      <h1 id="errorTitle">Не удалось открыть товар</h1>
      <div id="errorText" class="state"></div>
      <button id="retry" class="retry" type="button">Повторить</button>
    </section>
    <div class="footer">Информация предоставлена системой учёта Склад МДС</div>
  </main>
<script>
(() => {
  // This static page is hosted by GitHub Pages. The Edge Function is a JSON API only.
  // Do not put service_role / secret keys into this file.
  const API = "https://nrjuojlbcpxsyhiqpgif.supabase.co/functions/v1/product-view";
  // Publishable key is intended for public client applications; never replace it with a secret/service_role key.
  const PUBLISHABLE_KEY = "sb_publishable_6QyzyeBQVrkYBsCtfAGvng_q5cKEX58";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token") || "";
  const formatter = new Intl.NumberFormat("ru-RU", {minimumFractionDigits:2, maximumFractionDigits:2});

  function showError(title, message) {
    $("loading").classList.add("hidden");
    $("spinner").classList.add("hidden");
    $("product").classList.add("hidden");
    $("errorTitle").textContent = title;
    $("errorText").textContent = message;
    $("error").classList.remove("hidden");
  }

  async function loadProduct() {
    $("error").classList.add("hidden");
    $("product").classList.add("hidden");
    $("loading").classList.remove("hidden");
    $("spinner").classList.remove("hidden");
    if (!/^[0-9a-fA-F-]{36}$/.test(token)) {
      showError("QR-код не распознан", "В ссылке отсутствует корректный идентификатор товара. Отсканируйте QR-код ещё раз.");
      return;
    }
    try {
      const response = await fetch(`${API}?token=${encodeURIComponent(token)}`, {
        method: "GET", headers: {"Accept":"application/json", "apikey":PUBLISHABLE_KEY}, cache: "no-store"
      });
      const payload = await response.json();
      if (!response.ok || !payload || payload.ok !== true || !payload.product) {
        throw new Error(payload?.error || `Сервер вернул ошибку ${response.status}.`);
      }
      const p = payload.product;
      $("name").textContent = p.name || "Товар";
      $("brand").textContent = p.brand || "Бренд не указан";
      const amount = Number(p.sale_price);
      $("price").textContent = Number.isFinite(amount) ? `${formatter.format(amount)} ₽` : "Цена уточняется";
      $("unit").textContent = `за ${p.unit || "шт."}`;
      document.title = `${p.name || "Товар"} — Склад МДС`;
      $("loading").classList.add("hidden");
      $("spinner").classList.add("hidden");
      $("product").classList.remove("hidden");
    } catch (error) {
      showError("Не удалось загрузить товар", error?.message || "Проверьте интернет и попробуйте ещё раз.");
    }
  }
  $("retry").addEventListener("click", loadProduct);
  loadProduct();
})();
</script>
